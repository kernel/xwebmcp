name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run CLI tests
        run: go test ./...
      - name: Validate registry.json against spec/repository.md
        run: node scripts/validate-registry.mjs
      - name: Run tool tests
        run: node --test "tests/*.test.mjs"
      - name: Run extension tests
        run: node --test "extension/**/*.test.mjs"
      - name: Run bench tests
        run: node --test "bench/**/*.test.mjs"
