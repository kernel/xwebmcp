name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run CLI tests
        run: go test ./...
      - name: Validate registry.json against spec/repository.md
        run: node scripts/validate-registry.mjs
      - name: Run tool tests
        run: node --test "tests/*.test.mjs"
      - name: Install Chrome for extension browser tests
        run: |
          npx --yes @puppeteer/browsers@3.2.3 install chrome@stable --path "$RUNNER_TEMP/chrome"
          CHROME_BIN="$(find "$RUNNER_TEMP/chrome" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          test -n "$CHROME_BIN"
          echo "XWEBMCP_CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Run extension tests
        env:
          XWEBMCP_SYNTHETIC_CI: '1'
        run: node --test "extension/**/*.test.mjs"
      - name: Install bench dependencies
        run: npm ci --prefix bench
      - name: TEMP sandbox diagnostics
        run: |
          uname -a; cat /etc/os-release | head -2; bwrap --version
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
          cat /proc/sys/kernel/unprivileged_userns_clone || true
          ls /etc/apparmor.d | grep -i bwrap || true
          which node; readlink -f "$(which node)"
          bwrap --unshare-all --share-net --die-with-parent --new-session --ro-bind /usr /usr --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 --proc /proc --dev /dev --tmpfs /tmp --ro-bind "$(readlink -f "$(which node)")" "$(readlink -f "$(which node)")" -- "$(readlink -f "$(which node)")" -e 'console.log("node ok in bwrap")'; echo "exit=$?"
          sudo dmesg | tail -20 || true
      - name: Run bench tests
        run: node --test "bench/**/*.test.mjs"

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
