name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run CLI tests
        run: go test ./...
      - name: Validate registry.json against spec/repository.md
        run: node scripts/validate-registry.mjs
      - name: Run tool tests
        run: node --test "tests/*.test.mjs"
      - name: Install Chrome for extension browser tests
        run: |
          npx --yes @puppeteer/browsers@3.2.3 install chrome@stable --path "$RUNNER_TEMP/chrome"
          CHROME_BIN="$(find "$RUNNER_TEMP/chrome" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          test -n "$CHROME_BIN"
          echo "XWEBMCP_CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Run extension tests
        env:
          XWEBMCP_SYNTHETIC_CI: '1'
        run: node --test "extension/**/*.test.mjs"
      - name: Run bench tests
        run: node --test "bench/**/*.test.mjs"
